[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takom-kasir"
version = "1.9.0"
description = "Aplikasi Kasir (POS) dengan sinkronisasi cloud Supabase"
readme = "README.md"
authors = [{name = "Takom Team"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "psycopg[binary]>=3.1.0",
    "supabase>=2.0.0",
    "pyarrow>=12.0.0",
]
optional-dependencies = {dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "black>=23.0.0", "flake8>=6.0.0"], windows = ["pywin32>=306"]}

[project.scripts]
takom-kasir = "app_scan:main"
takom-sync = "sync_master:main"

[tool.black]
line-length = 100
target-version = ["py39"]
include = "\\.pyi?$"

[tool.flake8]
max-line-length = 100
extend-ignore = "E203,W503"
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    "*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=."

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]